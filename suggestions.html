<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网站建议与改进</title><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#14171d;color:#eee}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:40px auto;padding:20px}a{color:#e8c45b}.card{background:#20252e;border:1px solid #414853;padding:22px;border-radius:15px}input,textarea,select{display:block;width:100%;margin:9px 0 18px;padding:13px;background:#171c24;border:1px solid #657080;color:#fff;border-radius:8px;font:inherit}textarea{min-height:170px}button{background:#b8912c;color:#101015;border:0;border-radius:8px;padding:12px 20px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.status{min-height:24px;color:#e8c45b}.hide{display:none}.muted{color:#b8c0cb;font-size:14px}.entry{padding:15px 0;border-bottom:1px solid #48515e;white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main><a href="/">← 返回网站首页</a><h1>网站建议与改进</h1><p>欢迎提出网站功能、页面布局、手机体验或其他改进意见。建议不会公开展示，由网站管理员查看。</p><section class="card"><label>建议类别<select id="category"><option>功能建议</option><option>页面布局</option><option>手机体验</option><option>问题反馈</option><option>其他</option></select></label><label>建议内容<textarea id="message" maxlength="3000" placeholder="请具体说明希望改进的地方（至少10字）"></textarea></label><label>联系方式（选填）<input id="contact" maxlength="160" placeholder="邮箱或其他联系方式；不填写也可提交"></label><label class="hide" aria-hidden="true">网址<input id="website" tabindex="-1" autocomplete="off"></label><button id="send">提交建议</button><p id="status" class="status" role="status" aria-live="polite"></p><p class="muted">请勿提交密码、身份证号等敏感资料。为了减少垃圾信息，建议不要重复提交。</p></section><section class="card hide" id="admin"><h2>管理员 · 收到的建议</h2><button id="reload">刷新建议</button><div id="entries"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>'use strict';const $=id=>document.getElementById(id);const db=window.supabase?.createClient('https://mkchupvmervxkskvjyhz.supabase.co','sb_publishable_V3Gvd8EAOox1Se5XJBrmKQ_iRDLJm4Z');$('send').onclick=async()=>{const message=$('message').value.trim(),contact=$('contact').value.trim();if($('website').value)return;if(message.length<10||message.length>3000){$('status').textContent='建议内容需要10～3000字';return}if(!db){$('status').textContent='服务暂时不可用，请稍后再试';return}const btn=$('send');btn.disabled=true;$('status').textContent='正在提交……';try{const {error}=await db.from('site_suggestions').insert({category:$('category').value,message,contact:contact||null});if(error)throw error;$('status').textContent='建议已收到，感谢反馈。';$('message').value='';$('contact').value=''}catch(e){$('status').textContent='提交失败：'+e.message}finally{btn.disabled=false}};async function loadAdmin(){if(!db)return;const {data:u}=await db.auth.getUser();if(!u?.user)return;const {data:yes}=await db.rpc('is_site_admin');if(!yes)return;$('admin').classList.remove('hide');const {data,error}=await db.from('site_suggestions').select('id,category,message,contact,created_at,status').order('created_at',{ascending:false}).limit(100);const root=$('entries');root.replaceChildren();if(error){root.textContent=error.message;return}if(!data?.length){root.textContent='暂无建议';return}for(const item of data){const d=document.createElement('div');d.className='entry';const heading=document.createElement('strong');heading.textContent=item.category+' · '+new Date(item.created_at).toLocaleString('zh-CN')+' · '+item.status;const body=document.createElement('p');body.textContent=item.message;const contact=document.createElement('small');contact.textContent=item.contact?'联系方式：'+item.contact:'';const button=document.createElement('button');button.textContent='标记已处理';button.disabled=item.status==='done';button.onclick=async()=>{const {error}=await db.from('site_suggestions').update({status:'done'}).eq('id',item.id);if(error)alert(error.message);else loadAdmin()};d.append(heading,body,contact,document.createElement('br'),button);root.append(d)}}$('reload').onclick=loadAdmin;loadAdmin();</script><script src="/external-link-guard.js" defer></script><script src="/persistent-player-entry.js" defer></script><script src="/site-i18n.js?v=10" defer></script></body></html>
