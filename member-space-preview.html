(async()=>{try{const db=window.lyyAuth.createClient('https://mkchupvmervxkskvjyhz.supabase.co','sb_publishable_V3Gvd8EAOox1Se5XJBrmKQ_iRDLJm4Z');const {data:auth,error:authError}=await db.auth.getUser();if(authError||!auth?.user){$('status').textContent=t.login;return}const {data:owner,error:roleError}=await db.rpc('is_site_admin');if(roleError||owner!==true){$('status').textContent=t.denied;return}const uid=auth.user.id;initSkin(uid);const [profile,articles,posts]=await Promise.all([db.from('forum_profiles').select('display_name,public_id,show_public_id').eq('user_id',uid).maybeSingle(),db.from('member_articles').select('id,title,status,created_at').eq('author_id',uid).order('created_at',{ascending:false}).limit(30),db.from('forum_posts').select('id,title,status,created_at').eq('author_id',uid).order('created_at',{ascending:false}).limit(30)]);if(profile.error||articles.error||posts.error){$('status').textContent=t.error;return}$('display-name').textContent=profile.data?.display_name||auth.user.email?.split('@')[0]||'';$('public-id').textContent=profile.data?.show_public_id&&profile.data?.public_id?t.id+profile.data.public_id:'';addRows($('articles'),articles.data||[],'/member-articles.html#article=');addRows($('posts'),posts.data||[],'/forum.html#post=');$('content').hidden=false;$('status').textContent='';}catch(e){$('status').textContent=t.error}})();
