<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全站持续播放 · 测试版</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#081321;color:#edf3f9;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}
#site-frame{display:block;width:100%;height:calc(100dvh - 70px);border:0;background:#081321}
#persistent-player{height:70px;display:flex;align-items:center;gap:12px;padding:8px 18px;background:#101f30;border-top:1px solid #786535;box-shadow:0 -4px 22px #0006}
#persistent-player button{border:1px solid #826d36;background:#1d2c3d;color:#f5d782;border-radius:9px;padding:7px 11px;cursor:pointer}
#persistent-player #toggle{font-size:23px;min-width:48px}
#track{min-width:0;flex:1}#title{display:block;max-width:8em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#f2d68e;font-weight:700;font-size:14px}#status{font-size:11px;color:#b1becb}
#seek{width:min(28vw,260px)}#volume{width:75px}
@media(max-width:600px){#persistent-player{gap:7px;padding:7px 9px}#seek{width:18vw}#volume{display:none}#status{font-size:10px}#persistent-player button{padding:6px 8px}}
</style></head><body>
<iframe id="site-frame" title="网站内容" allow="autoplay"></iframe>
<div id="persistent-player" role="region" aria-label="全站持续音频播放器">
<button id="toggle" aria-label="播放或暂停">▶</button><div id="track"><span id="title">尚未选择音频</span><span id="status">打开论坛音频并点击播放</span></div>
<input id="seek" type="range" min="0" max="1000" value="0" aria-label="播放进度"><span id="clock" style="font-size:11px;white-space:nowrap">0:00</span>
<input id="volume" type="range" min="0" max="1" step=".05" value="1" aria-label="音量">
<button id="open-page" title="复制当前页面链接">链接</button>
</div>
<div id="drive-dock" hidden style="position:fixed;right:10px;bottom:76px;width:min(430px,calc(100vw - 20px));background:#101f30;border:1px solid #786535;border-radius:12px;padding:8px;z-index:100;box-shadow:0 8px 25px #0009"><button id="drive-close" style="float:right;background:#263a50;color:#f4d77d;border:0;border-radius:6px;padding:4px 9px">关闭</button><strong id="drive-title" style="display:block;padding:5px 0 9px;font-size:13px">讲道录音</strong><iframe id="drive-audio" title="Google Drive 音频" allow="autoplay; encrypted-media" style="width:100%;height:210px;border:0;border-radius:8px;background:#20252e"></iframe></div>
<script>
(()=>{
'use strict';
const frame=document.getElementById('site-frame'),audio=new Audio();audio.preload='metadata';
const title=document.getElementById('title'),status=document.getElementById('status'),toggle=document.getElementById('toggle'),seek=document.getElementById('seek'),clock=document.getElementById('clock'),volume=document.getElementById('volume');
let current='';
const fmt=n=>Number.isFinite(n)?Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0'):'0:00';
const allowed=path=>/^\/(?:|index\.html|forum\.html|gospel\.html|aid\.html|suggestions\.html|rules\.html|privacy\.html|content-complaints\.html)$/.test(path);
function safe(raw){try{const u=new URL(raw,location.origin);return u.origin===location.origin&&allowed(u.pathname)?u:null}catch{return null}}
function initial(){const u=safe(new URLSearchParams(location.search).get('page')||'/');return u||new URL('/',location.origin)}
function navigate(u,push=true){if(!u||!allowed(u.pathname))return;const dest=u.pathname+u.search+u.hash;frame.src=dest;if(push)history.pushState({page:dest},'', '/player.html?page='+encodeURIComponent(dest))}
function wire(){
 let doc;try{doc=frame.contentDocument;if(!doc)return}catch{return}
 const u=safe(frame.contentWindow.location.href);if(u){const dest=u.pathname+u.search+u.hash;history.replaceState({page:dest},'', '/player.html?page='+encodeURIComponent(dest));document.title=(doc.title||'网站')+' · 持续播放'}
 doc.addEventListener('click',e=>{
 const a=e.target.closest?.('a[href]');if(!a||e.defaultPrevented||e.button!==0||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||a.target&&a.target!=='_self'||a.hasAttribute('download'))return;
 const target=safe(a.href);if(!target)return;
 const now=frame.contentWindow.location;if(target.pathname===now.pathname&&target.search===now.search)return;
 e.preventDefault();navigate(target);
 },true);
}
frame.addEventListener('load',wire);
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow||e.data?.type!=='lyy-page-url')return;const u=safe(e.data.url);if(!u)return;const dest=u.pathname+u.search+u.hash;history.replaceState({page:dest},'', '/player.html?page='+encodeURIComponent(dest))});
window.addEventListener('popstate',()=>navigate(initial(),false));
window.addEventListener('message',async e=>{
 if(e.origin!==location.origin||e.source!==frame.contentWindow||!e.data||e.data.type!=='lyy-audio-play')return;
 try{
 const u=new URL(e.data.src);if(!/^https?:$/.test(u.protocol)||!(u.hostname==='lyy12788.com'||u.hostname.endsWith('.lyy12788.com')||u.hostname==='lyy12788.ink'||u.hostname.endsWith('.lyy12788.ink')||u.hostname==='mkchupvmervxkskvjyhz.supabase.co')){status.textContent='仅允许本站媒体域名';return}
 if(current!==u.href){drive.src='about:blank';dock.hidden=true;audio.src=u.href;current=u.href;title.textContent=String(e.data.title||decodeURIComponent(u.pathname.split('/').pop())||'音频').slice(0,160);await audio.play()}else if(audio.paused){await audio.play()}else{audio.pause()}
 }catch(err){status.textContent='播放失败，请检查音频链接'}
});
const dock=document.getElementById('drive-dock'),drive=document.getElementById('drive-audio');
document.getElementById('drive-close').onclick=()=>{dock.hidden=true;drive.src='about:blank'};
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow||e.data?.type!=='lyy-drive-play')return;const id=String(e.data.id||'');if(!/^[A-Za-z0-9_-]{15,100}$/.test(id))return;audio.pause();document.getElementById('drive-title').textContent=String(e.data.title||'讲道录音').slice(0,100);drive.src='https://drive.google.com/file/d/'+encodeURIComponent(id)+'/preview';dock.hidden=false;status.textContent='Google Drive 播放器已打开';});
audio.addEventListener('play',()=>{toggle.textContent='Ⅱ';status.textContent='正在播放'});
audio.addEventListener('pause',()=>{toggle.textContent='▶';status.textContent='已暂停'});
audio.addEventListener('ended',()=>{toggle.textContent='▶';status.textContent='播放结束'});
audio.addEventListener('error',()=>status.textContent='音频加载失败');
audio.addEventListener('timeupdate',()=>{if(audio.duration&&Number.isFinite(audio.duration))seek.value=Math.round(audio.currentTime/audio.duration*1000);clock.textContent=fmt(audio.currentTime)});
toggle.onclick=async()=>{if(!audio.src)return;try{audio.paused?await audio.play():audio.pause()}catch{status.textContent='播放失败'}};
seek.oninput=()=>{if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=audio.duration*Number(seek.value)/1000};
volume.oninput=()=>audio.volume=Number(volume.value);
document.getElementById('open-page').onclick=async()=>{try{await navigator.clipboard.writeText(frame.contentWindow.location.href);status.textContent='页面链接已复制'}catch{status.textContent='请从地址栏复制链接'}};
navigate(initial(),false);
})();
</script></body></html>
