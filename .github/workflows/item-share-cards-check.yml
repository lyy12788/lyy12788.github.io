name: Item share cards isolated checks
on:
  pull_request:
    branches:
      - feature/social-share-preview-20261123
  push:
    branches:
      - feature/item-share-cards-20261123
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated public share endpoint tests
        run: node --test tests/item-share-worker.test.mjs
      - name: Existing share metadata regression
        run: python3 tests/test_social_preview.py
      - name: Preview deployment isolation guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('wrangler.item-share-preview.toml').read_text()
          assert 'workers_dev = true' in text
          assert 'main = "cloudflare/item-share-worker.mjs"' in text
          assert not any(line.strip().startswith(('route =', 'routes =', 'account_id =', 'zone_id =')) for line in text.splitlines())
          assert 'SUPABASE_PUBLISHABLE_KEY = ' not in text
          print('Preview worker config is isolated; no production route or key embedded')
          PY
