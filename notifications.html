<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>消息中心 · 真实之声</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#071525;color:#e8edf5;font:16px/1.6 system-ui,-apple-system,sans-serif}main{max-width:960px;margin:auto;padding:24px 18px 100px}a{color:#efc34c}h1{color:#efc34c}button{cursor:pointer;background:#192e43;color:#fff;border:1px solid #5b6e81;border-radius:9px;padding:9px 14px}button.active{background:#e7b61b;color:#071525;border-color:#e7b61b}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.item{border:1px solid #344a61;background:#12263a;border-radius:12px;padding:15px;margin:10px 0}.item.unread{border-left:4px solid #e8bb25}.meta{color:#aebdd0;font-size:13px}.item h3{margin:4px 0;color:#f4d17a}.item p{margin:5px 0;overflow-wrap:anywhere}.settings{background:#12263a;border:1px solid #344a61;border-radius:12px;padding:15px;margin-top:20px}.prefs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.prefs label{display:flex;align-items:center;gap:8px}.muted{color:#b3c0cf}.actions{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}</style></head><body><main><a href="/forum.html">← 返回论坛</a><h1>🔔 消息中心</h1><p class="muted">按类别查看私信与账户动态。关闭提醒只会隐藏未读提醒标记，不会删除消息记录。</p><div id="status" role="status">正在检查登录状态…</div><div id="main-panel" hidden><div class="actions"><strong id="unread"></strong><button id="mark-all">全部标为已读</button></div><div id="tabs" class="tabs"></div><div id="items"></div><section class="settings"><h2>提醒设置</h2><p class="muted">取消勾选后，该类消息不再计入未读提醒；历史消息仍可查看。</p><div id="prefs" class="prefs"></div><p id="save-status" class="muted"></p></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
(function(){'use strict';
const db=window.supabase?.createClient('https://mkchupvmervxkskvjyhz.supabase.co','sb_publishable_V3Gvd8EAOox1Se5XJBrmKQ_iRDLJm4Z');
const categories=[['all','全部'],['message','私信'],['comment','评论'],['like','点赞'],['follow','关注'],['level','等级与权限'],['points','积分'],['moderation','处罚']];
const fields={message:'message',comment:'comment',like:'like_event',follow:'follow_event',level:'level_event',points:'points_event',moderation:'moderation_event'};
let uid=null,items=[],prefs={},filter='all';const $=id=>document.getElementById(id);
function node(tag,text){const x=document.createElement(tag);x.textContent=text;return x}
function status(t){$('status').textContent=t}
function render(){
$('tabs').replaceChildren();for(const [key,label] of categories){const b=node('button',label+(key==='all'?'':(' ('+items.filter(x=>x.category===key).length+')')));b.className=key===filter?'active':'';b.onclick=()=>{filter=key;render()};$('tabs').append(b)}
const enabled=x=>prefs[fields[x.category]]!==false;
$('unread').textContent='未读提醒 '+items.filter(x=>!x.is_read&&enabled(x)).length+' 条';
$('items').replaceChildren();
const shown=items.filter(x=>filter==='all'||x.category===filter);
if(!shown.length)$('items').append(node('p','暂无此类消息'));
for(const x of shown){const card=document.createElement('div');card.className='item'+(x.is_read?'':' unread');const head=node('h3',x.title);const meta=node('div',new Date(x.created_at).toLocaleString()+' · '+(categories.find(z=>z[0]===x.category)||['','通知'])[1]);meta.className='meta';card.append(head,meta,node('p',x.body||''));
const row=document.createElement('div');row.className='actions';const a=node('a','查看相关页面');a.href=x.target_url.startsWith('/')?x.target_url:'/forum.html';row.append(a);
if(!x.is_read){const b=node('button','标为已读');b.onclick=async()=>{const {error}=await db.from('member_notifications').update({is_read:true}).eq('id',x.id).eq('recipient_id',uid);if(error)return status('操作失败：'+error.message);x.is_read=true;render()};row.append(b)}card.append(row);$('items').append(card)}
$('prefs').replaceChildren();for(const [key,label] of categories.slice(1)){const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=prefs[fields[key]]!==false;c.onchange=async()=>{const old=prefs[fields[key]];prefs[fields[key]]=c.checked;render();const {error}=await db.from('member_notification_preferences').upsert({user_id:uid,...prefs,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error){prefs[fields[key]]=old;render();$('save-status').textContent='保存失败：'+error.message}else $('save-status').textContent='提醒偏好已保存'};l.append(c,node('span',label+'提醒'));$('prefs').append(l)}
}
$('mark-all').onclick=async()=>{const {error}=await db.from('member_notifications').update({is_read:true}).eq('recipient_id',uid).eq('is_read',false);if(error)return status('操作失败：'+error.message);items.forEach(x=>x.is_read=true);render()};
async function load(){const [a,b]=await Promise.all([db.from('member_notifications').select('id,category,title,body,target_url,is_read,created_at').order('created_at',{ascending:false}).limit(200),db.from('member_notification_preferences').select('*').eq('user_id',uid).maybeSingle()]);if(a.error){status('读取消息失败：'+a.error.message);return}items=a.data||[];prefs=b.data||{};if(b.error)status('提醒设置读取失败：'+b.error.message);else status('消息已更新');render()}
(async()=>{if(!db)return status('消息服务暂不可用');const {data,error}=await db.auth.getUser();if(error||!data.user){status('请先在论坛登录，然后返回消息中心。');const a=node('a','前往论坛登录');a.href='/forum.html';$('status').append(' ',a);return}uid=data.user.id;$('main-panel').hidden=false;await load();document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});setInterval(()=>{if(!document.hidden)load()},45000)})();
})();
</script><script src="/persistent-player-entry.js?v=20261118-3" defer></script><script src="/site-i18n.js?v=16" defer></script></body></html>
