function language(){try{return localStorage.getItem('lyy-site-language')||'zh-CN'}catch{return 'zh-CN'}}
function tr(v){const translated=window.lyyLanguage?.translate?.(v);return translated&&translated!==v?translated:(localLabels[language()]?.[v]||v)}
const fields={message:'message',comment:'comment',like:'like_event',follow:'follow_event',level:'level_event',points:'points_event',moderation:'moderation_event',report:'moderation_event',application:'moderation_event',appeal:'moderation_event',activity:'moderation_event'};
let uid=null,items=[],prefs={},filter='all',liveChannel=null;const $=id=>document.getElementById(id);
function node(tag,text){const x=document.createElement(tag);x.textContent=text;return x}
function status(t){$('status').textContent=t}
window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='lyy-language'&&uid)render()});
function render(){
$('tabs').replaceChildren();for(const [key,label] of categories){const b=node('button',tr(label)+(key==='all'?'':(' ('+items.filter(x=>x.category===key).length+')')));b.className=key===filter?'active':'';const unreadCount=items.filter(x=>!x.is_read&&(key==='all'||x.category===key)&&prefs[fields[x.category]]!==false).length;if(unreadCount){const badge=node('span',unreadCount>99?'99+':String(unreadCount));badge.className='unread-badge';badge.setAttribute('aria-label',tr('未读提醒')+' '+unreadCount);b.append(badge)}b.onclick=()=>{filter=key;render()};$('tabs').append(b)}
const enabled=x=>prefs[fields[x.category]]!==false;
$('unread').textContent=tr('未读提醒')+' '+items.filter(x=>!x.is_read&&enabled(x)).length+' '+tr('条');
$('items').replaceChildren();
const shown=items.filter(x=>filter==='all'||x.category===filter);
if(!shown.length)$('items').append(node('p',tr('暂无此类消息')));
for(const x of shown){const card=document.createElement('div');card.className='item'+(x.is_read?'':' unread');const head=node('h3',tr(x.title));const meta=node('div',new Date(x.created_at).toLocaleString()+' · '+tr((categories.find(z=>z[0]===x.category)||['','通知'])[1]));meta.className='meta';card.append(head,meta,node('p',tr(x.body||'')));
const row=document.createElement('div');row.className='actions';const a=node('a',tr('查看相关页面'));a.href=typeof x.target_url==='string'&&/^\/(?!\/)/.test(x.target_url)?x.target_url:'/forum.html';row.append(a);
if(!x.is_read){const b=node('button',tr('标为已读'));b.onclick=async()=>{const {error}=await db.from('member_notifications').update({is_read:true}).eq('id',x.id).eq('recipient_id',uid);if(error)return status(tr('操作失败：')+error.message);x.is_read=true;render()};row.append(b)}card.append(row);$('items').append(card)}
$('prefs').replaceChildren();for(const [key,label] of categories.slice(1)){const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=prefs[fields[key]]!==false;c.onchange=async()=>{const old=prefs[fields[key]];prefs[fields[key]]=c.checked;render();const {error}=await db.from('member_notification_preferences').upsert({user_id:uid,...prefs,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error){prefs[fields[key]]=old;render();$('save-status').textContent=tr('保存失败：')+error.message}else $('save-status').textContent=tr('提醒偏好已保存')};l.append(c,node('span',tr(label)+' · '+tr('提醒')));$('prefs').append(l)}
}
$('mark-all').onclick=async()=>{const {error}=await db.from('member_notifications').update({is_read:true}).eq('recipient_id',uid).eq('is_read',false);if(error)return status(tr('操作失败：')+error.message);items.forEach(x=>x.is_read=true);render()};
async function load(){const [a,b]=await Promise.all([db.from('member_notifications').select('id,category,title,body,target_url,is_read,created_at').order('created_at',{ascending:false}).limit(200),db.from('member_notification_preferences').select('*').eq('user_id',uid).maybeSingle()]);if(a.error){status(tr('读取消息失败：')+a.error.message);return}items=a.data||[];prefs=b.data||{};if(b.error)status(tr('提醒设置读取失败：')+b.error.message);else status(tr('消息已更新'));render()}
(async()=>{if(!db)return status(tr('消息服务暂不可用'));const {data,error}=await db.auth.getUser();if(error||!data.user){status(tr('请先在论坛登录，然后返回消息中心。'));const a=node('a',tr('前往论坛登录'));a.href='/forum.html';$('status').append(' ',a);return}uid=data.user.id;$('main-panel').hidden=false;const adminCheck=await db.rpc('is_site_admin');if(!adminCheck.error&&adminCheck.data)$('admin-shortcuts').hidden=false;await load();liveChannel=db.channel('member-notifications-'+uid).on('postgres_changes',{event:'*',schema:'public',table:'member_notifications',filter:'recipient_id=eq.'+uid},()=>{if(!document.hidden)load()}).subscribe();document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});setInterval(()=>{if(!document.hidden)load()},15000)})();
