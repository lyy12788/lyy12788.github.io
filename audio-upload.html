<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>音频上传管理 · 真实之声</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#081321;color:#e8eff8;font:16px/1.6 system-ui,-apple-system,sans-serif}main{max-width:620px;margin:0 auto;padding:24px 18px 100px}h1{color:#e8c778;font-size:24px}a{color:#e8c778}.panel{background:#132438;border:1px solid #38516b;border-radius:16px;padding:20px;margin:18px 0}label{display:block;margin:14px 0 6px;font-weight:600}input,textarea,select,button{font:inherit;border-radius:9px;padding:12px;width:100%}input,textarea,select{background:#0b1b2e;border:1px solid #61738a;color:#fff}button{background:#d9b75e;color:#102033;border:0;font-weight:700;margin-top:16px;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.muted{color:#b2c4d8;font-size:14px}progress{width:100%;height:18px;accent-color:#d9b75e}.hide{display:none}#message{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main><p><a href="/gospel.html">← 返回福音园地</a></p><h1>手机音频上传管理</h1><p class="muted">仅站长使用。支持 iPhone「文件」中的 MP3、M4A、AAC、WAV、OGG，单个文件最多100MB。上传至 Cloudflare R2。</p>
<section class="panel" id="login"><h2>管理员登录</h2><label for="email">邮箱</label><input id="email" type="email" autocomplete="username"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password"><button id="sign-in">登录</button><p class="muted">使用网站现有的 Supabase 管理员账户。</p></section>
<section class="panel hide" id="editor"><p id="account"></p><button id="sign-out" type="button">退出登录</button><label for="title">音频标题</label><input id="title" maxlength="150" required><label for="category">分类</label><select id="category"><option>讲道录音</option><option>福音入门</option><option>圣经讲解</option><option>信仰见证</option></select><label for="description">简介</label><textarea id="description" maxlength="3000" rows="3"></textarea><label for="file">选择音频</label><input id="file" type="file" accept=".m4a,.mp3,.aac,.wav,.ogg,audio/*"><button id="upload">上传至 R2 并发布</button><progress id="progress" class="hide" max="100" value="0"></progress></section><p id="message" role="status" aria-live="polite"></p><p class="muted">不会修改既有51条讲道的 Google Drive ID、评论、点赞或播放统计。上传前请确认有权公开传播。</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"></script><script>
(()=>{'use strict';const base='https://mkchupvmervxkskvjyhz.supabase.co',key='sb_publishable_V3Gvd8EAOox1Se5XJBrmKQ_iRDLJm4Z';const db=window.supabase.createClient(base,key);const $=id=>document.getElementById(id),message=s=>$('message').textContent=s;let admin=false;
async function refresh(){const {data:{user}}=await db.auth.getUser();admin=false;if(user){const r=await db.from('site_admins').select('user_id').eq('user_id',user.id).maybeSingle();admin=!r.error&&!!r.data} $('login').classList.toggle('hide',!!user);$('editor').classList.toggle('hide',!admin);$('account').textContent=user?'已登录：'+user.email:'';if(user&&!admin)message('当前账户没有站长上传权限。');}
$('sign-in').onclick=async()=>{const b=$('sign-in');b.disabled=true;try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;$('password').value='';await refresh()}catch(e){message('登录失败：'+e.message)}finally{b.disabled=false}};
$('sign-out').onclick=async()=>{await db.auth.signOut();admin=false;message('已退出');await refresh()};
$('upload').onclick=async()=>{if(!admin)return message('没有上传权限');const f=$('file').files?.[0],title=$('title').value.trim();const mimeByExt={mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',wav:'audio/wav',ogg:'audio/ogg'};const ext=f?.name.split('.').pop()?.toLowerCase();const mime=mimeByExt[ext];if(!f||!mime||f.size<1||f.size>100*1024*1024||title.length<2)return message('请选择100MB以内的音频并填写至少2个字的标题');const b=$('upload'),p=$('progress');b.disabled=true;p.classList.remove('hide');p.value=0;try{
const {data:{session}}=await db.auth.getSession();if(!session)throw Error('请重新登录');
message('正在获取安全上传授权…');
const auth=await fetch(base+'/functions/v1/r2-audio-upload-url',{method:'POST',headers:{'Content-Type':'application/json','apikey':key,'Authorization':'Bearer '+session.access_token},body:JSON.stringify({title,size:f.size,type:mime})});const signed=await auth.json();if(!auth.ok||!signed.url)throw Error(signed.error||'上传授权失败');
message('正在上传，请保持页面打开…');
await new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();xhr.open('PUT',signed.url);xhr.setRequestHeader('Content-Type',mime);xhr.upload.onprogress=e=>{if(e.lengthComputable)p.value=Math.round(e.loaded/e.total*100)};xhr.onload=()=>xhr.status>=200&&xhr.status<300?resolve():reject(Error('R2 上传失败（HTTP '+xhr.status+'）'));xhr.onerror=()=>reject(Error('网络或 R2 CORS 错误'));xhr.send(f)});
message('文件已上传，正在保存发布记录…');
const r=await db.from('gospel_audio').insert({title,description:$('description').value.trim(),category:$('category').value,storage_path:signed.key});if(r.error)throw Error('文件已到 R2，但发布记录未保存：'+r.error.message+'；文件路径：'+signed.key);
message('上传完成。文件路径：'+signed.key);$('file').value='';$('title').value='';$('description').value='';
}catch(e){message('未完成：'+e.message)}finally{b.disabled=false}};
refresh().catch(e=>message('初始化失败：'+e.message));})();
</script><script src="/persistent-player-entry.js" defer></script></body></html>
