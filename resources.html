<!doctype html>
<html lang="zh-CN" data-lyy-page="resources"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资料库 · 真实之声</title><link rel="stylesheet" href="/site-theme.css?v=5"><script src="/site-theme.js?v=5"></script><script>if(window.top===window.self)location.replace('/player.html?page='+encodeURIComponent(location.pathname+location.search+location.hash));</script><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#081321;color:#edf3f9;font:16px/1.7 system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:24px 18px 80px}a{color:#f5c84b}h1{margin:16px 0 8px}p{color:#bdcad7}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.filters button{padding:9px 13px;border:1px solid #49617a;border-radius:9px;background:#132b43;color:#edf3f9;cursor:pointer}.filters button.active{background:#e9c14c;color:#091929}.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.entry{display:block;border:1px solid #344b60;border-radius:12px;padding:16px;background:#11253a;text-decoration:none}.entry strong{display:block;color:#edf3f9}.entry small{color:#adbdce}.search{width:100%;padding:12px;background:#0b1d2e;color:#fff;border:1px solid #49617a;border-radius:8px;font:inherit}@media(max-width:650px){.list{grid-template-columns:1fr}}</style><link rel="stylesheet" href="/tablet-touch.css?v=1"><link rel="stylesheet" href="/wide-layout.css?v=1"></head>
<body><main><nav><a href="/index.html#home">← 返回主页</a>　<a href="/articles.html">文章专区</a></nav><h1>资料库</h1><p>按分类查阅网站已经公开的文章和资料。尚未发布的资料不会显示。</p><input id="search" class="search" type="search" placeholder="搜索资料标题或关键词" aria-label="搜索资料"><div id="filters" class="filters" aria-label="资料分类"></div><p id="count" aria-live="polite">正在加载资料……</p><div id="list" class="list"></div></main>
<script>(()=>{'use strict';let all=[],category='全部';const $=id=>document.getElementById(id);function render(){const q=$('search').value.trim().toLowerCase();const rows=all.filter(x=>(category==='全部'||x.category===category)&&(!q||[x.title,x.category,x.body].some(v=>String(v||'').toLowerCase().includes(q))));$('count').textContent='共 '+rows.length+' 项公开资料';$('list').replaceChildren();if(!rows.length){$('list').textContent='此分类暂无公开资料。';return}for(const x of rows){const a=document.createElement('a');a.className='entry';a.href='/index.html#post='+encodeURIComponent(x.slug);a.target='_blank';a.rel='noopener';const title=document.createElement('strong');title.textContent=x.title||'无标题';title.setAttribute('data-user-content','');const meta=document.createElement('small');meta.textContent=x.category+' · '+(x.date||'');a.append(title,meta);$('list').append(a)}}function filters(){const el=$('filters');el.replaceChildren();for(const c of ['全部',...new Set(all.map(x=>x.category))]){const b=document.createElement('button');b.type='button';b.textContent=c;b.className=c===category?'active':'';b.onclick=()=>{category=c;filters();render()};el.append(b)}}$('search').addEventListener('input',render);fetch('/articles.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('索引加载失败');return r.json()}).then(rows=>{all=(Array.isArray(rows)?rows:[]).filter(x=>x.slug).map(x=>({...x,category:x.category||'其他'})).sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));filters();render()}).catch(()=>{$('count').textContent='资料暂时无法加载，请稍后再试。'})})();</script><script src="/site-i18n.js?v=20261121-resources" defer></script><script src="/persistent-player-entry.js?v=20261118-3" defer></script><script src="/swipe-navigation.js?v=1" defer></script></body></html>
