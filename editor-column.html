<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>站长专栏 · 真实之声</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#081321;color:#edf3f9;font:16px/1.7 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px 18px 90px}h1{font-size:clamp(26px,4vw,38px);margin:16px 0 5px}h2{font-size:20px}p{color:#b8c9da}a{color:inherit;text-decoration:none}a:hover{color:#f5c84b}.intro{background:#11263b;border:1px solid #344b60;padding:20px;border-radius:14px}.intro h1{color:#f5c84b}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.filters button{background:#1b344c;border:1px solid #405872;border-radius:20px;color:#edf3f9;padding:7px 13px;cursor:pointer}.filters button.active{background:#e8bd40;color:#102033}.search{width:100%;padding:12px;border:1px solid #415a73;border-radius:9px;background:#0b1d2e;color:white;font:inherit}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.article{border:1px solid #344b60;border-radius:12px;padding:19px;background:#12263b;min-width:0;display:flex;flex-direction:column}.article h2{overflow-wrap:anywhere;line-height:1.5;margin:8px 0}.article .category{color:#f5c84b;font-size:13px}.article .meta{font-size:12px;color:#b2c3d4;margin-top:auto}.article .more{color:#f5c84b;font-size:13px;margin-top:8px}@media(max-width:640px){.grid{grid-template-columns:1fr}}</style></head><body><main><section class="intro"><h1>站长专栏</h1><p>杨利伟，来自中国河南，现居韩国济州岛。关注公共事务、个人自由与社会议题，在这里保存个人经历、时事评论、公开声明与资料记录。</p><p>本专栏仅代表站长个人观点，不代表其他会员或整个平台的立场。</p></section><section><h2>专栏文章</h2><input class="search" id="search" type="search" placeholder="搜索专栏文章…" aria-label="搜索专栏文章"><div id="filters" class="filters"></div><p id="count"></p><div id="list" class="grid">正在加载文章……</div></section></main><script>
(()=>{'use strict';let all=[],category='全部';const $=id=>document.getElementById(id);function render(){const query=$('search').value.trim().toLocaleLowerCase();const items=all.filter(a=>(category==='全部'||(a.category||'其他')===category)&&(!query||[a.title,a.category,a.body].some(v=>String(v||'').toLocaleLowerCase().includes(query))));$('count').textContent='共 '+items.length+' 篇';const list=$('list');list.replaceChildren();if(!items.length){list.textContent='没有找到匹配的文章。';return}for(const a of items){const link=document.createElement('a');link.className='article';link.href='/index.html#post='+encodeURIComponent(a.slug);const cat=document.createElement('span');cat.className='category';cat.textContent=a.category||'其他';const title=document.createElement('h2');title.textContent=a.title||'无标题';title.setAttribute('data-user-content','');const date=document.createElement('span');date.className='meta';date.textContent=a.date?new Date(a.date).toLocaleDateString():' ';const more=document.createElement('span');more.className='more';more.textContent='阅读全文 →';link.append(cat,title,date,more);list.append(link)}}$('search').addEventListener('input',render);fetch('/articles.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{all=Array.isArray(data)?data:[];all.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));const filters=$('filters');for(const c of ['全部',...new Set(all.map(a=>a.category||'其他'))]){const b=document.createElement('button');b.textContent=c;b.type='button';b.onclick=()=>{category=c;for(const el of filters.children)el.classList.toggle('active',el===b);render()};b.className=c==='全部'?'active':'';filters.append(b)}render()}).catch(()=>$('list').textContent='文章暂时无法加载，请稍后再试。')})();
</script><script src="/section-tabs.js?v=2" defer></script><script src="/site-i18n.js?v=26" defer></script><script src="/persistent-player-entry.js?v=20261118-3" defer></script></body></html>
