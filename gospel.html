<script>
(function(){
 const root=document.getElementById('drive-list');
 const statCache=new Map();
 async function refreshCounts(){
  const {data,error}=await db.rpc('gospel_sermon_counts');if(error){console.warn('录音统计读取失败',error.message);return}
  statCache.clear();for(const x of data||[])statCache.set(x.sermon_id,x);
  root.querySelectorAll('.sermon-metrics').forEach(node=>{const v=statCache.get(node.dataset.sermon)||{play_count:0,like_count:0,comment_count:0};node.querySelector('.metric-play').textContent='▶ '+v.play_count+' 播放';node.querySelector('.metric-like').textContent='♥ 点赞 '+v.like_count;node.querySelector('.metric-comment').textContent='💬 评论 '+v.comment_count})
 }
 window.recordSermonPlay=async id=>{
  const key='gospel-play-'+id,now=Date.now();
  try{if(now-Number(sessionStorage.getItem(key)||0)<1800000)return;sessionStorage.setItem(key,String(now))}catch{}
  const {error}=await db.rpc('gospel_sermon_play',{p_id:id});if(!error)refreshCounts()
 };
 async function commentsFor(id,node){
  let panel=node.closest('.sermon-row')?.querySelector('.sermon-comment-panel');
  if(panel){panel.remove();return}
  const row=node.closest('.sermon-row');if(!row)return;
  panel=document.createElement('div');panel.className='sermon-comment-panel';row.append(panel);
  const title=document.createElement('strong');title.textContent='💬 录音评论 · 欢迎交流';panel.append(title);
  const list=document.createElement('div');panel.append(list);
  const {data,error}=await db.from('gospel_sermon_comments').select('body,created_at').eq('sermon_id',id).order('created_at',{ascending:false}).limit(100);
  if(error)list.textContent='评论读取失败：'+error.message;
  else if(!data?.length)list.textContent='暂无评论';
  else for(const c of data){const p=document.createElement('div');p.className='sermon-comment-item';p.textContent=c.body+' · '+new Date(c.created_at).toLocaleDateString('zh-CN');list.append(p)}
  const field=document.createElement('textarea');field.placeholder='写下你的评论（登录会员可发表，最多1000字）';field.maxLength=1000;panel.append(field);
  const send=document.createElement('button');send.textContent='发表评论';panel.append(send);
  const msg=document.createElement('span');msg.style.marginLeft='12px';panel.append(msg);
  send.onclick=async()=>{
   const body=field.value.trim();if(!body){msg.textContent='请先输入评论';return}
   const {data:{user}}=await db.auth.getUser();if(!user){msg.replaceChildren(document.createTextNode('请先登录会员账号：'));const a=document.createElement('a');a.href='/forum.html#auth';a.textContent='前往登录';msg.append(a);return}
   send.disabled=true;
   const {error}=await db.from('gospel_sermon_comments').insert({sermon_id:id,user_id:user.id,body});
   send.disabled=false;if(error){msg.textContent='发表失败：'+error.message;return}
   field.value='';msg.textContent='发表成功';const p=document.createElement('div');p.className='sermon-comment-item';p.textContent=body+' · 刚刚';list.prepend(p);await refreshCounts()
  }
 }
 root.addEventListener('click',async event=>{
  const like=event.target.closest('.metric-like'),comment=event.target.closest('.metric-comment');
  if(!like&&!comment)return;
  const node=like||comment,id=node.closest('.sermon-metrics')?.dataset.sermon;if(!id)return;
  if(comment){commentsFor(id,node);return}
  const {data:{user}}=await db.auth.getUser();if(!user){if(confirm('点赞需要登录论坛会员账号。现在前往登录页面？'))location.href='/forum.html#auth';return}
  node.disabled=true;const {data:liked,error}=await db.rpc('gospel_sermon_toggle_like',{p_id:id});node.disabled=false;if(!error){node.classList.toggle('is-liked',liked===true);node.setAttribute('aria-pressed',liked===true?'true':'false')}
  if(error){alert('点赞失败：'+error.message);return}await refreshCounts()
 });
 refreshCounts();
})();
