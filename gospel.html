<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>福音园地 · 真实之声</title><style>body{background:#081321;color:#edf3f9;font:16px/1.7 system-ui,sans-serif;margin:0}main{max-width:850px;margin:auto;padding:28px 20px}a{color:#f5c84b}header{border-bottom:1px solid #314052;padding:16px}article,section{background:#132337;border:1px solid #314052;border-radius:14px;padding:20px;margin:18px 0}input,textarea,select,button{box-sizing:border-box;max-width:100%;font:inherit;padding:10px;border-radius:7px;margin:6px 0}input,textarea,select{width:100%}button{cursor:pointer}audio{width:100%}.muted{color:#b4c4d6}.hide{display:none}.download{display:inline-block;padding:9px 16px;border:1px solid #f5c84b;border-radius:8px}h1{color:#f5c84b}</style></head><body><header><a href="/">← 真实之声首页</a>　<a href="/forum.html">公共论坛</a></header><main><h1>福音园地</h1><p>福音信息、圣经分享与讲道录音。所有访客无需注册，即可免费收听和下载本站提供的录音。</p><div id="status" class="muted" role="status">正在加载录音……</div><div id="list"></div><section id="admin" class="hide"><h2>站长上传讲道录音</h2><p class="muted">仅网站管理员可上传；单个文件不超过100MB。支持 MP3、M4A、AAC、WAV、OGG。请只上传有权公开传播的音频。</p><label>标题<input id="title" maxlength="150"></label><label>分类<select id="category"><option>讲道录音</option><option>福音入门</option><option>圣经讲解</option><option>信仰见证</option></select></label><label>简介<textarea id="description" maxlength="3000"></textarea></label><label>选择音频<input id="file" type="file" accept=".mp3,.m4a,.aac,.wav,.ogg,audio/*"></label><button id="upload">上传并发布</button><p id="feedback" role="status"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const db=window.supabase.createClient('https://mkchupvmervxkskvjyhz.supabase.co','sb_publishable_V3Gvd8EAOox1Se5XJBrmKQ_iRDLJm4Z');const $=id=>document.getElementById(id);let admin=false;
async function load(){const {data,error}=await db.from('gospel_audio').select('id,title,description,category,storage_path,created_at').order('created_at',{ascending:false}).limit(100);$('list').replaceChildren();$('status').textContent=error?'录音读取失败：'+error.message:(!data?.length?'目前还没有发布录音。':'已发布 '+data.length+' 条录音');if(error)return;for(const x of data){const a=document.createElement('article');const h=document.createElement('h2');h.textContent=x.title;const p=document.createElement('p');p.textContent=x.category+' · '+new Date(x.created_at).toLocaleDateString('zh-CN');const desc=document.createElement('p');desc.textContent=x.description;const url=db.storage.from('gospel-audio').getPublicUrl(x.storage_path).data.publicUrl;const audio=document.createElement('audio');audio.controls=true;audio.preload='none';audio.src=url;const link=document.createElement('a');link.className='download';link.href=url;link.textContent='免费下载录音';link.setAttribute('download',x.title);link.target='_blank';link.rel='noopener';a.append(h,p,desc,audio,link);if(admin){const b=document.createElement('button');b.textContent='删除这条录音';b.onclick=async()=>{if(!confirm('确认删除此录音和文件？'))return;const {error:e}=await db.from('gospel_audio').delete().eq('id',x.id);if(e)return alert(e.message);const result=await db.storage.from('gospel-audio').remove([x.storage_path]);if(result.error)alert('记录已删除，但文件清理失败：'+result.error.message);load()};a.append(b)}$('list').append(a)}}
$('upload').onclick=async()=>{const f=$('file').files?.[0],title=$('title').value.trim();if(!f||title.length<2)return $('feedback').textContent='请填写标题并选择音频';const types={'audio/mpeg':'mp3','audio/mp4':'m4a','audio/x-m4a':'m4a','audio/aac':'aac','audio/wav':'wav','audio/x-wav':'wav','audio/ogg':'ogg'};const ext=types[f.type];if(!ext||f.size===0||f.size>100*1024*1024)return $('feedback').textContent='文件类型不支持或超过100MB';$('upload').disabled=true;$('feedback').textContent='正在上传，请勿关闭页面……';const path=crypto.randomUUID()+'.'+ext;try{const u=await db.storage.from('gospel-audio').upload(path,f,{contentType:f.type,upsert:false});if(u.error)throw u.error;const r=await db.from('gospel_audio').insert({title,description:$('description').value.trim(),category:$('category').value,storage_path:path});if(r.error){await db.storage.from('gospel-audio').remove([path]);throw r.error}$('feedback').textContent='发布成功';$('title').value='';$('file').value='';await load()}catch(e){$('feedback').textContent='上传失败：'+e.message}finally{$('upload').disabled=false}};
(async()=>{try{const {data}=await db.auth.getUser();if(data?.user){const r=await db.rpc('is_site_admin');admin=r.data===true;$('admin').classList.toggle('hide',!admin)}await load()}catch(e){$('status').textContent='加载失败：'+e.message}})();
</script></body></html>
