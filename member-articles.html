<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网友文章 · 真实之声</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#081321;color:#edf3f9;font:16px/1.7 system-ui,sans-serif}main{max-width:960px;margin:auto;padding:26px 18px 90px}h1,h2{color:#f5c84b}a{color:#f5c84b}p{color:#bac8d7}.card{background:#12263a;border:1px solid #344b60;border-radius:13px;padding:18px;margin:16px 0}input,textarea{display:block;width:100%;margin:8px 0 15px;padding:12px;border:1px solid #5b6b80;border-radius:8px;background:#09192b;color:white;font:inherit}textarea{min-height:230px;resize:vertical}button{border:0;border-radius:8px;padding:10px 17px;background:#e8bd40;color:#0a192a;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.5}small{color:#aebfd0}article h3{margin:0}article p{white-space:pre-wrap;overflow-wrap:anywhere}#editor[hidden]{display:none}</style></head><body><main><a href="/articles.html">← 返回文章专区</a><h1>网友文章</h1><p>这里展示会员正式投稿的文章，与公共论坛帖子分开管理。高级会员（LV4）及以上可投稿；所有新稿件须经审核后公开。</p><section class="card"><h2>文章投稿</h2><p id="eligibility">正在检查会员权限……</p><div id="editor" hidden><label>文章标题<input id="title" maxlength="120" placeholder="5—120个字符"></label><label>文章正文<textarea id="body" maxlength="50000" placeholder="100—50000个字符"></textarea></label><button id="submit" type="button">提交文章审核</button></div><p id="result" role="status"></p><a href="/forum.html">前往公共论坛发帖 →</a></section><section id="admin-review" hidden><h2>待审核文章</h2><div id="pending-list"></div></section><section><h2>已发表的网友文章</h2><div id="list">正在加载文章……</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
(async()=>{const $=id=>document.getElementById(id);const db=window.supabase?.createClient('https://mkchupvmervxkskvjyhz.supabase.co','sb_publishable_V3Gvd8EAOox1Se5XJBrmKQ_iRDLJm4Z');if(!db){$('eligibility').textContent='服务暂不可用';return}const {data:{user}}=await db.auth.getUser();let can=false;if(!user){$('eligibility').textContent='请先注册或登录。注册后仍需提升等级，才能向文章专区投稿。'}else if(!user.email_confirmed_at){$('eligibility').textContent='请先完成邮箱验证。'}else{const {data,error}=await db.rpc('forum_public_member_level',{p_user_id:user.id});if(error||!data?.length){$('eligibility').textContent='无法验证会员等级，请稍后再试。'}else{can=Boolean(data[0].is_admin||Number(data[0].level_number)>=4);if(data[0].is_admin)loadPending();$('eligibility').textContent=can?'您已具备文章投稿资格，提交后等待审核。':'文章投稿要求高级会员（LV4）及以上。请先在公共论坛交流、评论，积累积分提升等级。'}}$('editor').hidden=!can;$('submit').onclick=async()=>{if(!can)return;const title=$('title').value.trim(),body=$('body').value.trim();if(title.length<5||title.length>120||body.length<100||body.length>50000){$('result').textContent='标题需要5—120个字符，正文需要100—50000个字符。';return}const btn=$('submit');btn.disabled=true;const {error}=await db.from('member_articles').insert({author_id:user.id,title,body});btn.disabled=false;$('result').textContent=error?'提交失败：'+error.message:'投稿已提交，等待审核后公开。';if(!error){$('title').value='';$('body').value=''}};async function loadPending(){const section=$('admin-review');section.hidden=false;const root=$('pending-list');root.replaceChildren();const {data,error}=await db.from('member_articles').select('id,title,body,created_at').eq('status','pending').order('created_at',{ascending:true}).limit(50);if(error){root.textContent='审核列表读取失败';return}if(!data?.length){root.textContent='暂无待审核文章';return}for(const item of data){const card=document.createElement('article');card.className='card';const h=document.createElement('h3');h.textContent=item.title;const p=document.createElement('p');p.textContent=item.body;card.append(h,p);for(const [status,label] of [['published','通过审核'],['rejected','拒绝投稿']]){const b=document.createElement('button');b.textContent=label;b.style.marginRight='8px';b.onclick=async()=>{b.disabled=true;const {error}=await db.from('member_articles').update({status,reviewed_at:new Date().toISOString(),reviewed_by:user.id}).eq('id',item.id);if(error){alert('操作失败：'+error.message);b.disabled=false}else location.reload()};card.append(b)}root.append(card)}}const {data,error}=await db.from('member_articles').select('id,title,body,created_at').eq('status','published').order('created_at',{ascending:false}).limit(50);const list=$('list');list.replaceChildren();if(error){list.textContent='文章读取失败，请稍后再试。';return}if(!data?.length){list.textContent='暂无已发表的网友文章。';return}for(const item of data){const card=document.createElement('article');card.className='card';const h=document.createElement('h3');h.textContent=item.title;const meta=document.createElement('small');meta.textContent=new Date(item.created_at).toLocaleDateString();const p=document.createElement('p');p.textContent=item.body;card.append(h,meta,p);list.append(card)}})();
</script><script src="/section-tabs.js?v=1" defer></script><script src="/site-i18n.js?v=23" defer></script><script src="/persistent-player-entry.js?v=20261118-3" defer></script></body></html>
