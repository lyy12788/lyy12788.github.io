<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网友文章 · 真实之声</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#081321;color:#edf3f9;font:16px/1.7 system-ui,sans-serif}main{max-width:960px;margin:auto;padding:26px 18px 90px}h1,h2{color:#f5c84b}a{color:#f5c84b}p{color:#bac8d7}.card{background:#12263a;border:1px solid #344b60;border-radius:13px;padding:18px;margin:16px 0}input,textarea{display:block;width:100%;margin:8px 0 15px;padding:12px;border:1px solid #5b6b80;border-radius:8px;background:#09192b;color:white;font:inherit}textarea{min-height:230px;resize:vertical}button{border:0;border-radius:8px;padding:10px 17px;background:#e8bd40;color:#0a192a;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.5}small{color:#aebfd0}article h3{margin:0}article p{white-space:pre-wrap;overflow-wrap:anywhere}#editor[hidden]{display:none}</style></head><body><main><a href="/articles.html">← 返回文章专区</a><h1>网友文章</h1><p>这里展示会员正式投稿的文章，与公共论坛帖子分开管理。所有已验证邮箱的会员均可写作、保存私人草稿并申请发表；审核通过后才会公开。</p><section class="card"><h2>文章创作与投稿</h2><p id="eligibility">正在检查会员权限……</p><div id="editor" hidden><label>文章标题<input id="title" maxlength="30" placeholder="5—30个字符"></label><label>文章正文<textarea id="body" maxlength="50000" placeholder="100—50000个字符"></textarea></label><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="save" type="button">保存私人草稿</button><button id="submit" type="button">申请审核发表</button><button id="clear" type="button">新建文章</button></div></div><p id="result" role="status"></p><a href="/forum.html">前往公共论坛发帖 →</a></section><section class="card" id="mine" hidden><h2>我的文章与草稿</h2><div id="mine-list"></div></section><section id="admin-review" hidden><h2>待审核文章</h2><div id="pending-list"></div></section><section><h2>已发表的网友文章</h2><div id="list">正在加载文章……</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
(async()=>{'use strict';
const $=id=>document.getElementById(id),db=window.supabase?.createClient('https://mkchupvmervxkskvjyhz.supabase.co','sb_publishable_V3Gvd8EAOox1Se5XJBrmKQ_iRDLJm4Z');
if(!db){$('eligibility').textContent='服务暂不可用';return}
const {data:{user}}=await db.auth.getUser();let selected=null,admin=false;
const msg=t=>$('result').textContent=t;
const valid=(title,body)=>title.length>=5&&title.length<=30&&body.length>=100&&body.length<=50000;
const safeText=(tag,value)=>{const el=document.createElement(tag);el.textContent=value;el.setAttribute('data-user-content','');return el};
function reset() {selected=null;$('title').value='';$('body').value='';msg('已新建空白文章。')}
$('clear').onclick=reset;
async function save(submit){
 const title=$('title').value.trim(),body=$('body').value.trim();
 if(submit&&!valid(title,body)){msg('申请发表需要标题5—30字、正文100—50000字。');return}
 if(title.length>30||body.length>50000){msg('标题最多30字，正文最多50000字。');return}
 for(const id of ['save','submit'])$(id).disabled=true;
 let error;
 if(selected){({error}=await db.from('member_articles').update({title,body,status:submit?'pending':'draft'}).eq('id',selected));}
 else {const created=await db.from('member_articles').insert({author_id:user.id,title,body,status:'draft'}).select('id').single();error=created.error;if(!error){selected=created.data.id;if(submit){({error}=await db.from('member_articles').update({status:'pending'}).eq('id',selected));}}}
 for(const id of ['save','submit'])$(id).disabled=false;
 msg(error?'保存或申请失败：'+error.message:submit?'已提交发表申请，请等待站长或管理员审核。':'草稿已保存，仅您本人可见。');
 if(!error){reset();await loadMine();await loadPending()}
}
$('save').onclick=()=>save(false);$('submit').onclick=()=>save(true);
async function loadMine(){
 if(!user)return;$('mine').hidden=false;const root=$('mine-list');root.replaceChildren();
 const {data,error}=await db.from('member_articles').select('id,title,body,status,review_note,updated_at').eq('author_id',user.id).order('updated_at',{ascending:false}).limit(100);
 if(error){root.textContent='我的文章加载失败';return}
 if(!data?.length){root.textContent='还没有草稿或文章。';return}
 for(const item of data){const card=document.createElement('div');card.className='card';card.append(safeText('h3',item.title||'未命名草稿'),safeText('small',({draft:'私人草稿',pending:'等待审核',published:'已公开发表',rejected:'审核未通过'})[item.status]||item.status));
 if(item.review_note)card.append(safeText('p','审核意见：'+item.review_note));
 if(item.status==='draft'||item.status==='rejected'||item.status==='published'){
 const b=document.createElement('button');b.textContent=item.status==='published'?'修改并重新申请审核':'继续编辑';b.onclick=()=>{selected=item.id;$('title').value=item.title;$('body').value=item.body;window.scrollTo({top:0,behavior:'smooth'});msg(item.status==='published'?'修改已公开文章后将重新进入审核，修改前请确认。':'正在编辑文章。')};card.append(b)}
 root.append(card)}
}
async function loadPending(){
 if(!admin)return;const root=$('pending-list');$('admin-review').hidden=false;root.replaceChildren();
 const {data,error}=await db.from('member_articles').select('id,title,body,created_at').eq('status','pending').order('created_at',{ascending:true}).limit(100);
 if(error){root.textContent='审核列表读取失败';return}
 if(!data?.length){root.textContent='暂无待审核文章';return}
 for(const item of data){const card=document.createElement('article');card.className='card';card.append(safeText('h3',item.title),safeText('p',item.body));
 const note=document.createElement('textarea');note.placeholder='审核意见（拒绝时建议填写原因）';note.rows=2;card.append(note);
 for(const [status,label] of [['published','通过审核'],['rejected','拒绝投稿']]){
 const b=document.createElement('button');b.textContent=label;b.style.marginRight='8px';
 b.onclick=async()=>{if(status==='rejected'&&!note.value.trim()){alert('拒绝投稿时请填写原因。');return}b.disabled=true;
 const {error}=await db.from('member_articles').update({status,review_note:note.value.trim()||null}).eq('id',item.id);
 if(error){alert('操作失败：'+error.message);b.disabled=false}else{await loadPending();await loadPublic();await loadMine()}};
 card.append(b)}root.append(card)}
}
async function loadPublic(){
 const root=$('list');root.replaceChildren();const {data,error}=await db.from('member_articles').select('id,title,body,created_at').eq('status','published').order('created_at',{ascending:false}).limit(50);
 if(error){root.textContent='文章读取失败，请稍后再试。';return}
 if(!data?.length){root.textContent='暂无已发表的网友文章。';return}
 for(const item of data){const card=document.createElement('article');card.className='card';card.append(safeText('h3',item.title),safeText('small',new Date(item.created_at).toLocaleDateString()),safeText('p',item.body));root.append(card)}
}
if(!user){$('eligibility').textContent='请先登录并完成邮箱验证，才能写作或保存私人草稿。'}
else if(!user.email_confirmed_at){$('eligibility').textContent='请先完成邮箱验证。'}
else{
 const {data,error}=await db.rpc('forum_public_member_level',{p_user_id:user.id});
 admin=!error&&Boolean(data?.[0]?.is_admin);
 $('eligibility').textContent='您可以保存私人草稿，也可以申请由站长或管理员审核后公开发表。';
 $('editor').hidden=false;await loadMine();if(admin)await loadPending();
}
await loadPublic();
})();
</script><script src="/section-tabs.js?v=2" defer></script><script src="/site-i18n.js?v=27" defer></script><script src="/persistent-player-entry.js?v=20261118-3" defer></script></body></html>
