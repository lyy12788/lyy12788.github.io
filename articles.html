<!doctype html><html data-lyy-page="articles" lang="zh-CN"><head><link rel="stylesheet" href="/site-theme.css?v=4"><script src="/site-theme.js?v=5"></script><script>(function(){if(window.top!==window.self)return;location.replace('/player.html?page='+encodeURIComponent(location.pathname+location.search+location.hash))})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文章专区 · 真实之声</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#081321;color:#eaf0f7;font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1120px;margin:auto;padding:35px 22px 90px}a{color:inherit;text-decoration:none}a:hover{color:#f5c84b}.back{color:#f5c84b}h1{font-size:clamp(27px,4vw,40px);margin:24px 0 8px}p{color:#b9c7d7}.intro{max-width:800px}.columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:28px 0}.article-section{border:1px solid #33475e;border-radius:16px;background:#12263b;padding:26px;display:flex;flex-direction:column;min-height:330px}.article-section h2{margin:10px 0 6px;color:#f2d37b;font-size:25px}.article-section p{margin:8px 0}.eyebrow{font-size:12px;color:#eac35c;letter-spacing:.08em}.cta{display:inline-block;margin-top:auto;padding:10px 15px;background:#e5b832;color:#101b2a;border-radius:9px;font-weight:700;align-self:flex-start}.note{font-size:14px;border-top:1px solid #34465a;padding-top:18px}@media (max-width:650px), (pointer: coarse) and (orientation: landscape) and ((max-device-width: 500px) or (max-device-height: 500px)){main{padding:20px 16px 70px}.columns{grid-template-columns:1fr;gap:12px}.article-section{min-height:0;padding:21px}.cta{margin-top:14px}}.article-tools{display:grid;gap:10px;margin:24px 0 16px}.article-tools .cta{justify-self:start}.article-tools input{width:100%;max-width:620px;padding:.75rem;border:1px solid #658098;border-radius:8px;background:var(--site-card,#11253a);color:inherit;font:inherit}.article-filter{display:flex;flex-wrap:wrap;gap:8px}.article-filter[hidden]{display:none}.article-filter button,#article-directory-more{padding:.6rem .9rem;border:1px solid #658098;border-radius:8px;background:var(--site-card,#11253a);color:inherit;cursor:pointer;font:inherit}.article-filter [aria-pressed=true]{background:#f5c84b;color:#081321;border-color:#f5c84b}.article-directory-list{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:10px}.article-directory-list li{border:1px solid #658098;border-radius:10px;padding:12px 16px;overflow-wrap:anywhere}.article-directory-list a{display:block;text-decoration:underline;text-underline-offset:.18em}.article-directory-list small{display:block}</style><link rel="stylesheet" href="/tablet-touch.css?v=1"><link rel="stylesheet" href="/wide-layout.css?v=1"></head><body><main><a class="back" href="/#home">返回主页</a><h1 id="article-directory-title">文章专区</h1><p id="article-directory-category-nav" hidden><a href="/articles.html">查看全部文章</a></p><p class="intro">这里汇集来自不同作者的文章。你可以阅读网友的观点和经历，也可以浏览站长的个人记录与评论。不同观点可以并存，文章内容由各自作者负责。</p><div class="article-tools"><a class="cta" href="/member-articles.html?write=1">写文章</a><label for="article-query">搜索文章</label><input id="article-query" type="search" placeholder="搜索文章标题或关键词"><div class="article-filter" role="group" aria-label="文章分类"><button type="button" data-source="all" aria-pressed="true">全部文章</button><button type="button" data-source="member" aria-pressed="false">会员文章</button><button type="button" data-source="site" aria-pressed="false">站长文章</button></div></div><p id="article-directory-status" role="status">正在加载文章……</p><p id="article-directory-error" role="status" hidden></p><ul id="article-directory-list" class="article-directory-list"></ul><button id="article-directory-more" type="button" hidden>加载更多文章</button><p class="note">文章与论坛帖子均实行发布即公开；发现违规内容可举报，由管理员依法处理。</p></main><script src="/persistent-player-entry.js?v=20261118-3" defer></script><script src="/section-tabs.js?v=2" defer></script><script src="/site-i18n.js?v=20261121-member-space" defer></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="/auth-session.js?v=2"></script><script src="/notification-bell.js?v=6" defer></script><script defer src="/swipe-navigation.js?v=1"></script>
<script>(()=>{'use strict';
  const directory = document.querySelector('#article-directory-list');
  const query = document.querySelector('#article-query');
  const status = document.querySelector('#article-directory-status');
  const error = document.querySelector('#article-directory-error');
  const more = document.querySelector('#article-directory-more');
  const buttons = [...document.querySelectorAll('[data-source]')];
  const db = window.lyyAuth.createClient("https://mkchupvmervxkskvjyhz.supabase.co", "sb_publishable_V3Gvd8EAOox1Se5XJBrmKQ_iRDLJm4Z");
  const pageSize = 12;
  const categories = new Set(["政治观点","个人经历","国际局势","社会观察","公开声明","其他"]);
  const requestedCategory = new URLSearchParams(location.search).get('category');
  const category = categories.has(requestedCategory) ? requestedCategory : '';
  if (category) {
    document.querySelector('#article-directory-title').textContent = category;
    document.title = category + ' · 文章专区';
    document.querySelector('.intro').hidden = true;
    document.querySelector('#article-directory-category-nav').hidden = false;
    document.querySelector('.article-filter').hidden = true;
  }
  let source = 'all';
  let limit = pageSize;
  let entries = [];
  let owner = false;
  const curation = new Map();
  const key = a => (a.source === 'member' ? 'member:' + a.id : 'site:' + a.slug);
  function render() {
    const term = query.value.trim().toLocaleLowerCase();
    const results = entries.filter(a => (source === 'all' || a.source === source) &&
      (!category || (a.category || '其他') === category) &&
      (!term || [a.title, a.body].some(value => String(value || '').toLocaleLowerCase().includes(term)))).sort((a,b)=>Number(!!curation.get(key(b))?.is_pinned)-Number(!!curation.get(key(a))?.is_pinned));
    directory.replaceChildren();
    status.textContent = results.length ? '' : '没有符合条件的文章。';
    more.hidden = results.length <= limit;
    for (const a of results.slice(0, limit)) {
      const row = document.createElement('li');
      const link = document.createElement('a');
      const meta = document.createElement('small');
      const type = document.createElement('span');
      link.href = a.source === 'member' ? '/member-articles.html#article=' + encodeURIComponent(a.id) : '/index.html#post=' + encodeURIComponent(a.slug);
      link.textContent = a.title;
      link.setAttribute('data-user-content', '');
      type.textContent = a.source === 'member' ? '会员文章' : '站长文章';
      meta.append(type, ' · ', (a.date || '').slice(0, 10));
      const flag=curation.get(key(a));if(flag?.is_pinned||flag?.is_featured){const badge=document.createElement('strong');badge.textContent=[flag.is_pinned?'置顶':'',flag.is_featured?'精选':''].filter(Boolean).join(' · ');badge.style.cssText='color:#d6ad4a;margin-right:8px';row.prepend(badge)}
      if(owner){for(const [field,on,off] of [['is_pinned','置顶','取消置顶'],['is_featured','设为精选','取消精选']]){const btn=document.createElement('button');btn.type='button';btn.textContent=flag?.[field]?off:on;btn.style.cssText='margin-left:8px;font-size:12px';btn.onclick=async()=>{btn.disabled=true;const [kind,id]=key(a).split(':');const next={source:kind,content_id:id,is_pinned:!!flag?.is_pinned,is_featured:!!flag?.is_featured};next[field]=!next[field];const {data:{user}}=await db.auth.getUser();const {error}=await db.from('content_curation').upsert({...next,updated_by:user.id},{onConflict:'source,content_id'});if(error){alert('操作失败：'+error.message);btn.disabled=false;return}curation.set(key(a),next);render()};row.append(btn)}}
      row.append(link, meta);
      directory.append(row);
    }
  }
  async function siteArticles() {
    const response = await fetch('/articles.json');
    if (!response.ok) throw new Error('article index unavailable');
    const index = await response.json();
    return index.filter(a => a.slug && a.title).map(a => ({...a, source:'site'}));
  }
  async function memberArticles() {
    if (!db) throw new Error('member index unavailable');
    const response = await db.from('member_articles').select('id,title,body,published_at,created_at')
      .eq('status','published').order('published_at',{ascending:false,nullsFirst:false})
      .order('created_at',{ascending:false}).order('id').limit(100);
    if (response.error) throw response.error;
    return response.data.map(a => ({...a, date:a.published_at || a.created_at, source:'member'}));
  }
  query.addEventListener('input', () => { limit = pageSize; render(); });
  more.addEventListener('click', () => { limit += pageSize; render(); });
  for (const button of buttons) {
    button.addEventListener('click', () => {
      source = button.dataset.source;
      limit = pageSize;
      for (const control of buttons) control.setAttribute('aria-pressed', String(control === button));
      render();
    });
  }
  Promise.allSettled(category ? [siteArticles()] : [siteArticles(), memberArticles()]).then(async results => {
    entries = results.flatMap(result => result.status === 'fulfilled' ? result.value : [])
      .sort((a,b) => (Date.parse(b.date) || 0) - (Date.parse(a.date) || 0));
    if (results.some(result => result.status === 'rejected')) {
      error.textContent = '部分文章暂时无法加载，请稍后再试。';
      error.hidden = false;
    }
    if(db){const [{data:flags},{data:{user}}]=await Promise.all([db.from('content_curation').select('source,content_id,is_pinned,is_featured'),db.auth.getUser()]);for(const flag of flags||[])curation.set(flag.source+':'+flag.content_id,flag);if(user){const role=await db.rpc('is_site_admin');owner=role.data===true}}
    render();
  });
})();</script></body></html>
